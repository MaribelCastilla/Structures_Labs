<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Structural Optimization Lab</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        body { background-color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
        .grid-bg { background-image: linear-gradient(#e2e8f0 1px, transparent 1px), linear-gradient(90deg, #e2e8f0 1px, transparent 1px); background-size: 20px 20px; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo } = React;

        const translations = {
            en: {
                title: "Structural Optimization Lab",
                toggle: "🇪🇸 Cambiar a Español",
                case: "Select Case",
                caseE23: "Case E23 (Double Overhang Beam)",
                caseA3: "Case A3 (Single Overhang Beam)",
                caseA1: "Case A1 (Fixed-Fixed Beam, 2 Hinges)",
                caseA2: "Case A2 (Fixed-Pinned Beam, 1 Hinge)",
                casePortalPinned: "Case A.10 (Portal Frame, Pinned Base)",
                casePortalFixed: "Case A.11 (Portal Frame, Fixed Base)",
                controls: "Span Controls",
                spanL: "Main Span (L)",
                spanLv: "Secondary Span / Overhang (Lv)",
                spanH: "Frame Height (h)",
                loadQ: "Uniform Load (q)",
                ratio: "Current Ratio (Lv / L)",
                optimalEq: "Optimal Conditions:",
                posMoment: "Max Positive Moment (+M)",
                negMoment: "Max Negative Moment (-M)",
                optimized: "Optimized (Equal Stresses)!",
                compression: "C",
                tension: "T",
                bmdTitle: "Bending Moment Diagram",
                chartTitle: "Max Moment vs. Height",
                maxAbsMoment: "Max Absolute Moment",
                optimum: "Optimum"
            },
            es: {
                title: "Laboratorio de Optimización Estructural",
                toggle: "🇬🇧 Switch to English",
                case: "Seleccionar Caso",
                caseE23: "Caso E23 (Viga Doble Voladizo)",
                caseA3: "Caso A3 (Viga Voladizo Simple)",
                caseA1: "Caso A1 (Viga Biempotrada, 2 Rótulas)",
                caseA2: "Caso A2 (Viga Empotrada-Apoyada, 1 Rótula)",
                casePortalPinned: "Caso A.10 (Pórtico Base Articulada)",
                casePortalFixed: "Caso A.11 (Pórtico Base Empotrada)",
                controls: "Parámetros Geométricos",
                spanL: "Luz Principal (L)",
                spanLv: "Luz Secundaria / Voladizo (Lv)",
                spanH: "Altura del Pórtico (h)",
                loadQ: "Carga Uniforme (q)",
                ratio: "Relación Actual (Lv / L)",
                optimalEq: "Condiciones Óptimas:",
                posMoment: "Momento Positivo Máx (+M)",
                negMoment: "Momento Negativo Máx (-M)",
                optimized: "¡Optimizado (Tensiones Iguales)!",
                compression: "C",
                tension: "T",
                bmdTitle: "Diagrama de Momentos Flectores",
                chartTitle: "Momento Máximo vs. Altura",
                maxAbsMoment: "Momento Máximo Absoluto",
                optimum: "Óptimo"
            }
        };

        const StressDiagram = ({ moment, maxMomentAllowed, isPositive, t }) => {
            const scale = Math.min(Math.abs(moment) / maxMomentAllowed, 1.5);
            const w = 120, h = 100;
            const centerX = w / 2;
            const topY = 10, botY = h - 10;
            const maxStressW = 40 * scale; 
            
            const topDir = isPositive ? 1 : -1;
            const botDir = isPositive ? -1 : 1;

            return (
                <div className="flex items-center space-x-4 bg-white p-4 rounded-lg shadow border border-gray-200">
                    <svg width="40" height="100" viewBox="0 0 40 100">
                        <rect x="5" y="10" width="30" height="8" fill="#475569" />
                        <rect x="16" y="18" width="8" height="64" fill="#475569" />
                        <rect x="5" y="82" width="30" height="8" fill="#475569" />
                        <line x1="0" y1="50" x2="40" y2="50" stroke="#94a3b8" strokeDasharray="4" />
                    </svg>

                    <svg width={w} height={h} viewBox={`0 0 ${w} ${h}`}>
                        <line x1="0" y1="50" x2={w} y2="50" stroke="#cbd5e1" strokeDasharray="4" />
                        <line x1={centerX} y1={topY} x2={centerX} y2={botY} stroke="#94a3b8" />
                        
                        <polygon 
                            points={`${centerX},50 ${centerX + maxStressW * topDir},${topY} ${centerX},${topY}`} 
                            fill={isPositive ? "#ef4444" : "#3b82f6"} fillOpacity="0.5" stroke={isPositive ? "#ef4444" : "#3b82f6"} 
                        />
                        <polygon 
                            points={`${centerX},50 ${centerX + maxStressW * botDir},${botY} ${centerX},${botY}`} 
                            fill={isPositive ? "#3b82f6" : "#ef4444"} fillOpacity="0.5" stroke={isPositive ? "#3b82f6" : "#ef4444"} 
                        />
                        
                        <text x={centerX + maxStressW * topDir + (topDir > 0 ? 5 : -15)} y={topY + 8} fontSize="10" fill="#333">
                            {isPositive ? t.compression : t.tension}
                        </text>
                        <text x={centerX + maxStressW * botDir + (botDir > 0 ? 5 : -15)} y={botY} fontSize="10" fill="#333">
                            {isPositive ? t.tension : t.compression}
                        </text>
                        <text x="5" y="15" fontSize="12" fontWeight="bold" fill="#333">{Math.abs(moment).toFixed(2)}</text>
                    </svg>
                </div>
            );
        };

        const App = () => {
            const [lang, setLang] = useState('en');
            const [selectedCase, setSelectedCase] = useState('A1');
            const [L, setL] = useState(6);
            const [Lv, setLv] = useState(1.24);
            const [h, setH] = useState(5);
            const [q, setQ] = useState(20);
            
            const t = translations[lang];

            const calculations = useMemo(() => {
                const isPortal = selectedCase === 'PORTAL_PINNED' || selectedCase === 'PORTAL_FIXED';

                if (isPortal) {
                    const supportType = selectedCase === 'PORTAL_PINNED' ? 'pinned' : 'fixed';
                    const k = h / L;
                    const qL2 = q * L * L;
                    
                    let mc = 0;
                    if (supportType === 'pinned') {
                        mc = qL2 / (4 * (3 + 2 * k));
                    } else {
                        mc = qL2 / (12 + 6 * k);
                    }
                    
                    const mm = (qL2 / 8) - mc;
                    const maxM = Math.max(mc, Math.abs(mm));
                    const optH = supportType === 'pinned' ? L / 2 : (2 / 3) * L;

                    const curvePoints = [];
                    for (let h_val = 1; h_val <= 20; h_val += 0.25) {
                        const k_val = h_val / L;
                        const mc_val = supportType === 'pinned' ? qL2 / (4 * (3 + 2 * k_val)) : qL2 / (12 + 6 * k_val);
                        const mm_val = (qL2 / 8) - mc_val;
                        curvePoints.push({ h: h_val, m: Math.max(mc_val, Math.abs(mm_val)) });
                    }

                    return { 
                        type: 'portal', 
                        supportType,
                        mCorner: mc, 
                        mMid: mm, 
                        maxMoment: maxM, 
                        optimalH: optH, 
                        curvePoints,
                        optLvStr: `h = ${optH.toFixed(2)} m`
                    };
                } else {
                    const qBeam = 10; 
                    let M_pos = 0, M_neg = 0, totalLen = 0;
                    let points = []; 
                    let optLvStr = "";
                    let optLStr = "";

                    if (selectedCase === 'E23') {
                        totalLen = L + 2 * Lv;
                        M_neg = -(qBeam * Lv * Lv) / 2;
                        M_pos = (qBeam * L * L) / 8 + M_neg; 
                        
                        optLvStr = `Lv = L / √8 ≈ ${(L / Math.sqrt(8)).toFixed(2)} m`;
                        optLStr = `L = Lv · √8 ≈ ${(Lv * Math.sqrt(8)).toFixed(2)} m`;

                        for(let i=0; i<=200; i++) {
                            const x = (i / 200) * totalLen;
                            let mx = 0;
                            if (x <= Lv) mx = -(qBeam * x * x) / 2;
                            else if (x <= Lv + L) {
                                const R = qBeam * totalLen / 2;
                                mx = -(qBeam * x * x)/2 + R * (x - Lv);
                            } else mx = -(qBeam * (totalLen - x) * (totalLen - x)) / 2;
                            points.push({x, mx});
                        }
                    } else if (selectedCase === 'A3') {
                        totalLen = L + Lv;
                        const R2 = (qBeam * totalLen * totalLen) / (2 * L);
                        const R1 = qBeam * totalLen - R2;
                        
                        M_neg = -(qBeam * Lv * Lv) / 2; 
                        const x_pos = R1 / qBeam;
                        M_pos = (x_pos > 0 && x_pos < L) ? R1 * x_pos - (qBeam * x_pos * x_pos) / 2 : 0;

                        optLvStr = `Lv = L(√2 - 1) ≈ ${(L * (Math.sqrt(2) - 1)).toFixed(2)} m`;
                        optLStr = `L = Lv(√2 + 1) ≈ ${(Lv * (Math.sqrt(2) + 1)).toFixed(2)} m`;

                        for(let i=0; i<=200; i++) {
                            const x = (i / 200) * totalLen;
                            points.push({x, mx: x <= L ? R1 * x - (qBeam * x * x) / 2 : -(qBeam * (totalLen - x) * (totalLen - x)) / 2});
                        }
                    } else if (selectedCase === 'A1') {
                        totalLen = L + 2 * Lv;
                        const V = (qBeam * L) / 2;
                        M_neg = -(qBeam * Lv * Lv / 2 + V * Lv);
                        M_pos = (qBeam * L * L) / 8;
                        
                        optLvStr = `Lv = L(√2 - 1) / 2 ≈ ${(L * (Math.sqrt(2) - 1) / 2).toFixed(2)} m`;
                        optLStr = `L = 2Lv(√2 + 1) ≈ ${(Lv * 2 * (Math.sqrt(2) + 1)).toFixed(2)} m`;

                        for(let i=0; i<=200; i++) {
                            const x = (i / 200) * totalLen;
                            let mx = 0;
                            if (x <= Lv) mx = M_neg + (qBeam * Lv + V) * x - (qBeam * x * x) / 2;
                            else if (x <= Lv + L) mx = V * (x - Lv) - (qBeam * (x - Lv) * (x - Lv)) / 2;
                            else mx = M_neg + (qBeam * Lv + V) * (totalLen - x) - (qBeam * (totalLen - x) * (totalLen - x)) / 2;
                            points.push({x, mx});
                        }
                    } else if (selectedCase === 'A2') {
                        totalLen = L + Lv;
                        const V = (qBeam * L) / 2; 
                        M_neg = -(qBeam * Lv * Lv / 2 + V * Lv);
                        M_pos = (qBeam * L * L) / 8;
                        
                        optLvStr = `Lv = L(√2 - 1) / 2 ≈ ${(L * (Math.sqrt(2) - 1) / 2).toFixed(2)} m`;
                        optLStr = `L = 2Lv(√2 + 1) ≈ ${(Lv * 2 * (Math.sqrt(2) + 1)).toFixed(2)} m`;

                        for(let i=0; i<=200; i++) {
                            const x = (i / 200) * totalLen;
                            points.push({x, mx: x <= Lv ? M_neg + (qBeam * Lv + V) * x - (qBeam * x * x) / 2 : V * (x - Lv) - (qBeam * (x - Lv) * (x - Lv)) / 2});
                        }
                    }

                    return { type: 'beam', M_pos, M_neg, points, totalLen, optLvStr, optLStr, q: qBeam };
                }
            }, [selectedCase, L, Lv, h, q]);

            const isOptimized = calculations.type === 'beam' 
                ? Math.abs(Math.abs(calculations.M_pos) - Math.abs(calculations.M_neg)) < 0.5
                : Math.abs(h - calculations.optimalH) < 0.1;

            return (
                <div className="max-w-6xl mx-auto p-6 flex flex-col min-h-screen">
                    <header className="flex justify-between items-center mb-6 border-b pb-4">
                        <div className="flex items-center space-x-4">
                            <img 
                                src="https://www.uspceu.com/Portals/_default/skins/uspceu-multi//assets/img/logos/Logo-CEU-Positivo.svg" 
                                alt="Logotipo USP CEU - Área de Mecánica de Sólidos y Medios Continuos" 
                                className="h-16 w-auto object-contain rounded-md shadow-sm"
                            />
                            <h1 className="text-2xl font-bold text-slate-800">{t.title}</h1>
                        </div>
                        <button 
                            onClick={() => setLang(lang === 'en' ? 'es' : 'en')}
                            className="px-4 py-2 bg-slate-200 hover:bg-slate-300 rounded text-sm font-medium transition"
                        >
                            {t.toggle}
                        </button>
                    </header>

                    <div className="grid grid-cols-1 lg:grid-cols-3 gap-8 flex-grow">
                        {/* CONTROLES */}
                        <div className="bg-white p-6 rounded-xl shadow-sm border border-slate-200 h-fit space-y-6">
                            <div>
                                <label className="block text-sm font-semibold text-slate-700 mb-2">{t.case}</label>
                                <select 
                                    value={selectedCase} 
                                    onChange={(e) => setSelectedCase(e.target.value)}
                                    className="w-full p-2 border rounded bg-slate-50 font-medium"
                                >
                                    <optgroup label="Beams">
                                        <option value="A1">{t.caseA1}</option>
                                        <option value="A2">{t.caseA2}</option>
                                        <option value="A3">{t.caseA3}</option>
                                        <option value="E23">{t.caseE23}</option>
                                    </optgroup>
                                    <optgroup label="Portal Frames">
                                        <option value="PORTAL_PINNED">{t.casePortalPinned}</option>
                                        <option value="PORTAL_FIXED">{t.casePortalFixed}</option>
                                    </optgroup>
                                </select>
                            </div>

                            <div className="p-4 bg-slate-50 border border-slate-200 rounded-lg space-y-4">
                                <h3 className="font-semibold text-sm text-slate-800">{t.controls}</h3>
                                
                                <div>
                                    <label className="flex justify-between text-xs font-medium text-slate-600 mb-1">
                                        <span>{t.spanL}</span>
                                        <span>{L.toFixed(1)} m</span>
                                    </label>
                                    <input type="range" min="2" max="20" step="0.5" value={L} onChange={(e) => setL(parseFloat(e.target.value))} className="w-full" />
                                </div>

                                {calculations.type === 'beam' && (
                                    <>
                                        <div>
                                            <label className="flex justify-between text-xs font-medium text-slate-600 mb-1">
                                                <span>{t.spanLv}</span>
                                                <span>{Lv.toFixed(2)} m</span>
                                            </label>
                                            <input type="range" min="0" max="10" step="0.05" value={Lv} onChange={(e) => setLv(parseFloat(e.target.value))} className="w-full" />
                                        </div>
                                        <div className="pt-2 border-t border-slate-200 flex justify-between items-center text-sm">
                                            <span className="font-medium text-slate-700">{t.ratio}:</span>
                                            <span className="font-mono bg-slate-200 px-2 py-1 rounded">{(Lv/L).toFixed(3)}</span>
                                        </div>
                                    </>
                                )}

                                {calculations.type === 'portal' && (
                                    <>
                                        <div>
                                            <label className="flex justify-between text-xs font-medium text-slate-600 mb-1">
                                                <span>{t.spanH}</span>
                                                <span>{h.toFixed(1)} m</span>
                                            </label>
                                            <input type="range" min="1" max="20" step="0.5" value={h} onChange={(e) => setH(parseFloat(e.target.value))} className="w-full" />
                                        </div>
                                        <div>
                                            <label className="flex justify-between text-xs font-medium text-slate-600 mb-1">
                                                <span>{t.loadQ}</span>
                                                <span>{q.toFixed(1)} kN/m</span>
                                            </label>
                                            <input type="range" min="5" max="50" step="1" value={q} onChange={(e) => setQ(parseFloat(e.target.value))} className="w-full" />
                                        </div>
                                    </>
                                )}
                            </div>
                            
                            <div className="p-4 bg-blue-50 border border-blue-100 rounded-lg">
                                <span className="block text-xs font-semibold text-blue-800 mb-2">{t.optimalEq}</span>
                                <div className="space-y-1">
                                    <code className="block text-sm font-bold text-blue-900">{calculations.optLvStr}</code>
                                    {calculations.type === 'beam' && <code className="block text-sm font-bold text-blue-900">{calculations.optLStr}</code>}
                                </div>
                            </div>

                            {isOptimized && (
                                <div className="p-3 bg-green-100 text-green-800 rounded font-bold text-center border border-green-300 animate-pulse">
                                    {t.optimized}
                                </div>
                            )}
                        </div>

                        {/* VISUALIZACIONES */}
                        <div className="lg:col-span-2 space-y-6">
                            
                            {calculations.type === 'beam' ? (
                                <>
                                    {/* RENDER DE VIGAS */}
                                    <div className="flex flex-col sm:flex-row justify-around space-y-4 sm:space-y-0 sm:space-x-4">
                                        <div className="text-center">
                                            <h3 className="font-semibold text-sm mb-2 text-slate-600">{t.posMoment}</h3>
                                            <StressDiagram moment={calculations.M_pos} maxMomentAllowed={(calculations.q * 8 * 8) / 8} isPositive={true} t={t} />
                                        </div>
                                        <div className="text-center">
                                            <h3 className="font-semibold text-sm mb-2 text-slate-600">{t.negMoment}</h3>
                                            <StressDiagram moment={calculations.M_neg} maxMomentAllowed={(calculations.q * 8 * 8) / 8} isPositive={false} t={t} />
                                        </div>
                                    </div>

                                    <div className="w-full h-[400px] bg-white rounded-xl shadow-inner border border-slate-300 relative overflow-hidden grid-bg">
                                        <svg viewBox="-20 0 1040 384" width="100%" height="100%" preserveAspectRatio="none">
                                            <polygon points={`0,192 ${calculations.points.map(p => `${(p.x / calculations.totalLen) * 1000},${192 + p.mx}`).join(' ')} 1000,192`} fill="rgba(59, 130, 246, 0.2)" />
                                            <polyline points={calculations.points.map(p => `${(p.x / calculations.totalLen) * 1000},${192 + p.mx}`).join(' ')} fill="none" stroke="#2563eb" strokeWidth="2" />
                                            <line x1="0" y1="192" x2="1000" y2="192" stroke="#1e293b" strokeWidth="3" />
                                            
                                            {selectedCase === 'E23' && (
                                                <>
                                                    <polygon points={`${(Lv / calculations.totalLen) * 1000},192 ${(Lv / calculations.totalLen) * 1000 - 10},212 ${(Lv / calculations.totalLen) * 1000 + 10},212`} fill="#64748b" />
                                                    <polygon points={`${((Lv + L) / calculations.totalLen) * 1000},192 ${((Lv + L) / calculations.totalLen) * 1000 - 10},212 ${((Lv + L) / calculations.totalLen) * 1000 + 10},212`} fill="#64748b" />
                                                </>
                                            )}
                                            {selectedCase === 'A3' && (
                                                <>
                                                    <polygon points="0,192 -10,212 10,212" fill="#64748b" />
                                                    <polygon points={`${(L / calculations.totalLen) * 1000},192 ${(L / calculations.totalLen) * 1000 - 10},212 ${(L / calculations.totalLen) * 1000 + 10},212`} fill="#64748b" />
                                                </>
                                            )}
                                            {selectedCase === 'A1' && (
                                                <>
                                                    <rect x="-10" y="172" width="10" height="40" fill="#cbd5e1"/>
                                                    <line x1="0" y1="172" x2="0" y2="212" stroke="#1e293b" strokeWidth="3"/>
                                                    <circle cx={(Lv / calculations.totalLen) * 1000} cy="192" r="5" fill="white" stroke="#1e293b" strokeWidth="2" />
                                                    <circle cx={((Lv + L) / calculations.totalLen) * 1000} cy="192" r="5" fill="white" stroke="#1e293b" strokeWidth="2" />
                                                    <rect x="1000" y="172" width="10" height="40" fill="#cbd5e1"/>
                                                    <line x1="1000" y1="172" x2="1000" y2="212" stroke="#1e293b" strokeWidth="3"/>
                                                </>
                                            )}
                                            {selectedCase === 'A2' && (
                                                <>
                                                    <rect x="-10" y="172" width="10" height="40" fill="#cbd5e1"/>
                                                    <line x1="0" y1="172" x2="0" y2="212" stroke="#1e293b" strokeWidth="3"/>
                                                    <circle cx={(Lv / calculations.totalLen) * 1000} cy="192" r="5" fill="white" stroke="#1e293b" strokeWidth="2" />
                                                    <polygon points={`1000,192 990,212 1010,212`} fill="#64748b" />
                                                </>
                                            )}
                                            
                                            <rect x="0" y="162" width="1000" height="30" fill="url(#loadPattern)" opacity="0.6" />
                                            <defs>
                                                <pattern id="loadPattern" width="20" height="30" patternUnits="userSpaceOnUse">
                                                    <line x1="10" y1="0" x2="10" y2="30" stroke="#ef4444" strokeWidth="2" />
                                                    <polygon points="5,25 15,25 10,30" fill="#ef4444" />
                                                </pattern>
                                            </defs>
                                        </svg>
                                    </div>
                                </>
                            ) : (
                                <>
                                    {/* RENDER DE PÓRTICOS */}
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                        <div className="bg-slate-50 border border-slate-200 rounded-lg p-4 flex flex-col justify-between">
                                            <h3 className="text-sm font-bold text-slate-500 mb-4">{t.posMoment} (M mid): <span className="text-slate-900 font-mono">{calculations.mMid.toFixed(1)}</span></h3>
                                            <h3 className="text-sm font-bold text-slate-500 mb-4">{t.negMoment} (M corner): <span className="text-slate-900 font-mono">{-calculations.mCorner.toFixed(1)}</span></h3>
                                            <div className="pt-4 border-t border-slate-200">
                                                <h3 className="text-sm font-bold text-blue-700">{t.maxAbsMoment}: <span className="font-mono">{calculations.maxMoment.toFixed(1)}</span></h3>
                                            </div>
                                        </div>

                                        {/* GRÁFICA DE OPTIMIZACIÓN */}
                                        <div className="bg-white border border-slate-200 rounded-lg p-4 relative overflow-hidden h-[200px]">
                                            <h3 className="text-xs font-bold text-slate-400 absolute top-2 left-2">{t.chartTitle}</h3>
                                            <svg viewBox="0 0 500 200" width="100%" height="100%">
                                                {(() => {
                                                    const pad = 30;
                                                    const maxM = Math.max(...calculations.curvePoints.map(p => p.m));
                                                    const minM = Math.min(...calculations.curvePoints.map(p => p.m));
                                                    const getCoord = (hVal, mVal) => ({
                                                        x: pad + ((hVal - 1) / 19) * (500 - pad * 2),
                                                        y: 200 - pad - ((mVal - minM) / (maxM - minM || 1)) * (200 - pad * 2)
                                                    });
                                                    
                                                    const chartPath = `M ${calculations.curvePoints.map(p => {
                                                        const c = getCoord(p.h, p.m); return `${c.x},${c.y}`;
                                                    }).join(' L ')}`;
                                                    
                                                    const optC = getCoord(calculations.optimalH, minM);
                                                    const curC = getCoord(h, calculations.maxMoment);

                                                    return (
                                                        <>
                                                            <line x1={pad} y1={pad} x2={pad} y2={200-pad} stroke="#cbd5e1" strokeWidth="2" />
                                                            <line x1={pad} y1={200-pad} x2={500-pad} y2={200-pad} stroke="#cbd5e1" strokeWidth="2" />
                                                            
                                                            <line x1={optC.x} y1={pad} x2={optC.x} y2={200-pad} stroke="#10b981" strokeWidth="1" strokeDasharray="4 4" />
                                                            <text x={optC.x + 5} y={pad + 10} fontSize="11" fill="#10b981" fontWeight="bold">{t.optimum}</text>

                                                            <path d={chartPath} fill="none" stroke="#3b82f6" strokeWidth="3" />
                                                            
                                                            <circle cx={curC.x} cy={curC.y} r="6" fill="#ef4444" />
                                                        </>
                                                    );
                                                })()}
                                            </svg>
                                        </div>
                                    </div>

                                    {/* SVG DEL PÓRTICO (ESCALA DINÁMICA) */}
                                    <div className="w-full h-[400px] bg-white rounded-xl shadow-inner border border-slate-300 relative overflow-hidden grid-bg flex items-center justify-center p-4">
                                        <svg viewBox="0 0 1000 400" width="100%" height="100%">
                                            {(() => {
                                                const maxWidth = 800; 
                                                const maxHeight = 300; 
                                                const drawScale = Math.min(maxWidth / L, maxHeight / h);
                                                
                                                const centerX = 500;
                                                const groundY = 350;
                                                const leftX = centerX - (L * drawScale) / 2;
                                                const rightX = centerX + (L * drawScale) / 2;
                                                const topY = groundY - (h * drawScale);
                                                
                                                const refMoment = (q * L * L) / 8;
                                                const bmdScale = 80 / refMoment; 

                                                const beamBMD = `M ${leftX},${topY} ${Array.from({length: 41}).map((_, i) => {
                                                    const x = i * (L/40);
                                                    const xPx = leftX + i * ((rightX - leftX)/40);
                                                    const mx = (q * L * x) / 2 - (q * x * x) / 2 - calculations.mCorner;
                                                    return `L ${xPx},${topY + (mx * bmdScale)}`;
                                                }).join(' ')} L ${rightX},${topY} Z`;

                                                const mBase = calculations.supportType === 'pinned' ? 0 : calculations.mCorner / 2;
                                                const leftColBMD = `M ${leftX},${groundY} L ${leftX - mBase * bmdScale},${groundY} L ${leftX - calculations.mCorner * bmdScale},${topY} L ${leftX},${topY} Z`;
                                                const rightColBMD = `M ${rightX},${groundY} L ${rightX + mBase * bmdScale},${groundY} L ${rightX + calculations.mCorner * bmdScale},${topY} L ${rightX},${topY} Z`;

                                                return (
                                                    <>
                                                        <path d={leftColBMD} fill="rgba(239, 68, 68, 0.2)" stroke="#ef4444" strokeWidth="1.5" />
                                                        <path d={rightColBMD} fill="rgba(239, 68, 68, 0.2)" stroke="#ef4444" strokeWidth="1.5" />
                                                        <path d={beamBMD} fill="rgba(59, 130, 246, 0.2)" stroke="#3b82f6" strokeWidth="1.5" />
                                                        
                                                        <polyline points={`${leftX},${groundY} ${leftX},${topY} ${rightX},${topY} ${rightX},${groundY}`} fill="none" stroke="#1e293b" strokeWidth="4" strokeLinejoin="round" />
                                                        <line x1={50} y1={groundY} x2={950} y2={groundY} stroke="#94a3b8" strokeWidth="2" />
                                                        
                                                        {calculations.supportType === 'pinned' ? (
                                                            <>
                                                                <polygon points={`${leftX},${groundY} ${leftX-12},${groundY+18} ${leftX+12},${groundY+18}`} fill="#fff" stroke="#1e293b" strokeWidth="2" />
                                                                <polygon points={`${rightX},${groundY} ${rightX-12},${groundY+18} ${rightX+12},${groundY+18}`} fill="#fff" stroke="#1e293b" strokeWidth="2" />
                                                            </>
                                                        ) : (
                                                            <>
                                                                <rect x={leftX-18} y={groundY} width={36} height={12} fill="#1e293b" />
                                                                <rect x={rightX-18} y={groundY} width={36} height={12} fill="#1e293b" />
                                                            </>
                                                        )}

                                                        <line x1={leftX} y1={topY - 20} x2={rightX} y2={topY - 20} stroke="#64748b" strokeWidth="2" />
                                                        <text x={centerX} y={topY - 30} textAnchor="middle" fill="#64748b" fontSize="16" fontWeight="bold">q = {q} kN/m</text>
                                                    </>
                                                );
                                            })()}
                                        </svg>
                                    </div>
                                </>
                            )}
                        </div>
                    </div>
                    
                    <footer className="mt-8 pt-6 border-t border-slate-200 text-center text-sm text-slate-500 font-medium">
                        &copy; {new Date().getFullYear()} Universidad CEU San Pablo - Área de Mecánica del sólido y medios continuos
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
